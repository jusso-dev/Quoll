[package]
name = "quoll-detect"
description = "Framework, ORM, auth-library and CI-provider detection for Quoll"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
quoll-core.workspace = true
# For Walker::read and Parsers. Detection reuses the walker's path-containment guard
